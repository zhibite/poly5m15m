<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运行配置 - Polymarket 5m/15m</title>
<link rel="stylesheet" href="/static/style.css?v=__ASSET_VERSION__">
</head>
<body>
<nav>
  <span class="brand">POLY 5M/15M</span>
  <a href="/">看板</a>
  <a href="/trades">成交记录</a>
  <a href="/config" class="active">配置</a>
  <div class="nav-right">
    <span id="auth-area" class="nav-auth"></span>
  </div>
</nav>

<div class="container">
  <div class="page-head">
    <div>
      <h1>运行配置</h1>
      <div class="page-sub">修改后立即生效；标有“重启生效”的项请通过环境变量修改</div>
    </div>
    <div class="head-meta">
      <div>模式 <span id="mode" class="pill">—</span></div>
      <div id="updated" class="muted">—</div>
    </div>
  </div>

  <div id="alert-box"></div>

  <div class="control-bar" id="control-bar">
    <div class="control-status">
      <span class="control-dot" id="control-dot"></span>
      <span class="control-label" id="control-label">—</span>
      <span class="control-meta" id="control-meta"></span>
    </div>
    <div class="control-actions">
      <button class="btn btn-danger" id="btn-stop" type="button">停止开新仓</button>
      <button class="btn btn-ghost" id="btn-start" type="button">恢复运行</button>
    </div>
  </div>

  <div id="config-groups"></div>

  <div class="save-bar">
    <button class="btn btn-primary" id="btn-save" type="button">保存配置</button>
    <span class="save-msg" id="save-msg"></span>
  </div>
</div>

<footer id="health">—</footer>

<script src="/static/auth-nav.js?v=__ASSET_VERSION__"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));

let original = {};

function showAlert(html, cls) {
  $('alert-box').innerHTML = html
    ? `<div class="alert ${cls || 'warn'}">${esc(html)}</div>`
    : '';
}

function renderField(f) {
  original[f.key] = f.value;
  const el = document.createElement('div');
  el.className = 'field' + (f.editable ? '' : ' readonly');

  const label = document.createElement('label');
  const scope = f.restart
    ? '<span class="scope restart">重启生效</span>'
    : (f.editable
      ? '<span class="scope immediate">立即生效</span>'
      : '<span class="scope">只读</span>');
  label.innerHTML = esc(f.label) + ' ' + scope;
  el.appendChild(label);

  const key = document.createElement('div');
  key.className = 'key';
  key.textContent = f.key;
  el.appendChild(key);

  let input;
  if (f.kind === 'bool') {
    input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = !!f.value;
    input.disabled = !f.editable;
  } else if (f.kind === 'select') {
    input = document.createElement('select');
    input.disabled = !f.editable;
    for (const choice of f.choices || []) {
      const option = document.createElement('option');
      option.value = choice;
      option.textContent = choice;
      if (choice === f.value) option.selected = true;
      input.appendChild(option);
    }
  } else {
    input = document.createElement('input');
    input.type = (f.kind === 'int' || f.kind === 'float') ? 'number' : 'text';
    if (f.step !== null && f.step !== undefined) input.step = f.step;
    if (f.min !== null && f.min !== undefined) input.min = f.min;
    if (f.max !== null && f.max !== undefined) input.max = f.max;
    input.value = f.value ?? '';
    input.disabled = !f.editable;
  }
  input.dataset.key = f.key;
  input.dataset.kind = f.kind;
  el.appendChild(input);

  if (f.help) {
    const help = document.createElement('div');
    help.className = 'help';
    help.textContent = f.help;
    el.appendChild(help);
  }
  return el;
}

function render(data) {
  const box = $('config-groups');
  box.innerHTML = '';
  original = {};
  const fields = data.fields || [];
  for (const group of (data.groups || [])) {
    const items = fields.filter((f) => f.group === group);
    if (!items.length) continue;
    const section = document.createElement('div');
    section.className = 'config-group';
    const title = document.createElement('h2');
    title.innerHTML = '<span class="dot"></span>' + esc(group) +
      '<span class="count">' + items.length + ' 项</span>';
    section.appendChild(title);
    const grid = document.createElement('div');
    grid.className = 'config-grid';
    for (const f of items) grid.appendChild(renderField(f));
    section.appendChild(grid);
    box.appendChild(section);
  }
  $('mode').textContent = data.mode === 'live' ? '实盘' : '纸面';
  $('mode').className = 'pill ' + (data.mode === 'live' ? 'sell' : 'watching');
  $('updated').textContent = '配置已加载 ' + new Date().toLocaleTimeString();
}

async function loadConfig() {
  try {
    const r = await fetch('/api/config', { cache: 'no-store' });
    if (r.status === 401) { location.href = '/login?next=/config'; return; }
    const data = await r.json();
    if (!r.ok) { showAlert(data.detail || '配置加载失败'); return; }
    showAlert('');
    render(data);
  } catch (e) {
    showAlert('配置加载失败：' + e);
  }
}

function collectChanges() {
  const values = {};
  document.querySelectorAll('#config-groups [data-key]').forEach((input) => {
    if (input.disabled) return;
    const key = input.dataset.key;
    const kind = input.dataset.kind;
    let value;
    if (kind === 'bool') value = input.checked;
    else if (kind === 'int') {
      if (input.value === '') return;
      value = parseInt(input.value, 10);
    } else if (kind === 'float') {
      if (input.value === '') return;
      value = parseFloat(input.value);
    } else value = input.value;
    if (JSON.stringify(value) !== JSON.stringify(original[key])) {
      values[key] = value;
    }
  });
  return values;
}

async function save() {
  const values = collectChanges();
  if (!Object.keys(values).length) {
    $('save-msg').textContent = '没有修改';
    return;
  }
  $('btn-save').disabled = true;
  $('save-msg').textContent = '保存中…';
  try {
    const r = await fetch('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ values }),
    });
    if (r.status === 401) { location.href = '/login?next=/config'; return; }
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.detail || ('HTTP ' + r.status));
    render(body.config);
    $('save-msg').textContent = (body.updated || []).length
      ? '已保存，立即生效' : '没有修改';
    if (body.restart_required && body.restart_required.length) {
      $('save-msg').textContent += '；需要重启：' + body.restart_required.join(', ');
    }
  } catch (e) {
    $('save-msg').textContent = '保存失败：' + e.message;
  } finally {
    $('btn-save').disabled = false;
  }
}

async function loadControl() {
  try {
    const r = await fetch('/api/control', { cache: 'no-store' });
    if (r.status === 401) return;
    const state = await r.json();
    const active = !!state.active;
    $('control-dot').className = 'control-dot ' + (active ? 'stopped' : 'running');
    $('control-label').textContent = active ? '已停止开新仓' : '运行中';
    $('control-meta').textContent = active
      ? ('原因：' + (state.reason || 'manual'))
      : '可以开新仓；已有仓位正常结算';
    $('btn-stop').disabled = active;
    $('btn-start').disabled = !active;
  } catch (e) { /* the page still works; control is best-effort */ }
}

async function stopBot() {
  if (!confirm('确定停止开新仓吗？已有仓位仍会正常结算。')) return;
  await fetch('/api/control/stop', { method: 'POST' });
  await loadControl();
}

async function startBot() {
  if (!confirm('确定恢复开新仓吗？')) return;
  await fetch('/api/control/start', { method: 'POST' });
  await loadControl();
}

document.addEventListener('DOMContentLoaded', () => {
  $('btn-save').addEventListener('click', save);
  $('btn-stop').addEventListener('click', stopBot);
  $('btn-start').addEventListener('click', startBot);
  loadConfig();
  loadControl();
  setInterval(loadControl, 5000);
});
</script>
</body>
</html>
